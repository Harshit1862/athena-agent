<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Athena</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #e6e8ee;
    --muted: #8891a3; --accent: #5b8def; --tool: #d99a3f; --result: #4fae6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
  }
  .col { display: flex; flex-direction: column; height: 100vh; }
  .chat { flex: 1.3; border-right: 1px solid var(--border); }
  .trace { flex: 1; }
  .header { padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .header .sub { font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: white; }
  .msg.agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .inputRow { display: flex; gap: 8px; padding: 14px; border-top: 1px solid var(--border); }
  .inputRow input {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 14px;
  }
  .inputRow button {
    background: var(--accent); border: none; color: white; padding: 0 18px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .traceLog { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: ui-monospace, monospace; font-size: 12.5px; }
  .step { margin-bottom: 8px; padding: 8px 10px; border-radius: 6px; border-left: 3px solid var(--border); background: var(--panel); }
  .step.thought { border-left-color: var(--accent); }
  .step.tool_call { border-left-color: var(--tool); }
  .step.tool_result { border-left-color: var(--result); }
  .step.final { border-left-color: #c25bd9; }
  .step .kind { color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; }
  .step .body { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); font-size: 13px; padding: 16px; }
</style>
</head>
<body>
  <div class="col chat">
    <div class="header">Athena<div class="sub">research agent · local qwen3:8b</div></div>
    <div class="messages" id="messages">
      <div class="empty">Ask a question — e.g. "what's recent work on efficient LLM reasoning?"</div>
    </div>
    <div class="inputRow">
      <input id="input" placeholder="Ask Athena…" autofocus />
      <button id="send">Send</button>
    </div>
  </div>
  <div class="col trace">
    <div class="header">Agent trace<div class="sub">every step, live</div></div>
    <div class="traceLog" id="trace"></div>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const traceEl = document.getElementById('trace');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let history = [];

function addMessage(role, text) {
  if (messagesEl.querySelector('.empty')) messagesEl.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addStep(kind, tool_name, content) {
  const div = document.createElement('div');
  div.className = 'step ' + kind;
  const label = tool_name ? `${kind} · ${tool_name}` : kind;
  div.innerHTML = `<div class="kind">${label}</div><div class="body"></div>`;
  div.querySelector('.body').textContent = content;
  traceEl.appendChild(div);
  traceEl.scrollTop = traceEl.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage('user', text);
  traceEl.innerHTML = '';
  const agentDiv = addMessage('agent', '…');

  let finalAnswer = '';
  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history }),
    });

    if (!resp.ok) {
      const body = await resp.text().catch(() => '');
      throw new Error(`server returned ${resp.status} ${resp.statusText}${body ? ': ' + body.slice(0, 300) : ''}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');
      const chunks = buffer.split('\n\n');
      buffer = chunks.pop();
      for (const chunk of chunks) {
        const lines = chunk.split('\n');
        let event = 'message', data = '';
        for (const line of lines) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          if (line.startsWith('data:')) data = line.slice(5).trim();
        }
        if (!data) continue;
        const parsed = JSON.parse(data);
        addStep(parsed.kind, parsed.tool_name, parsed.content);
        if (parsed.kind === 'final') finalAnswer = parsed.content;
      }
    }

    if (!finalAnswer) throw new Error('stream ended with no final answer');
  } catch (err) {
    addStep('final', null, String(err.message || err));
    agentDiv.textContent = `Error: ${err.message || err}`;
    return;
  }

  agentDiv.textContent = finalAnswer;
  history.push({ role: 'user', content: text });
  history.push({ role: 'assistant', content: finalAnswer });
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
